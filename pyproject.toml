[project]
name = "agentworld-mcp"
version = "1.0.0"
description = "MCP server for AgentWorld: live AI agent economy, 164 tools"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3.0", "httpx>=0.27"]
license = { text = "MIT" }

[project.urls]
Homepage = "https://agentworld.me"

[project.scripts]
agentworld-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
